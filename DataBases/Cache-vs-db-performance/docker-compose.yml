version: '3.8'
services:
  redis:  
    image: redis:latest
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  postgres:
    image: postgres:latest
    environment: 
      POSTGRES_DB: testdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U user -d testdb"]
      interval: 5s
      timeout: 3s
      retries: 5